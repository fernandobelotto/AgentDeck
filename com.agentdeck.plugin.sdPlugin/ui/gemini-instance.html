<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gemini Instance</title>
  <style>
    :root {
      --sdpi-bgcolor: #2d2d2d;
      --sdpi-color: #d8d8d8;
      --sdpi-bordercolor: #3a3a3a;
      --sdpi-highlight: #4285F4;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      background-color: var(--sdpi-bgcolor);
      color: var(--sdpi-color);
    }

    .sdpi-wrapper {
      padding: 8px;
    }

    .sdpi-item {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }

    .sdpi-item-label {
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--sdpi-color);
    }

    .sdpi-item-value {
      width: 100%;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--sdpi-bordercolor);
      border-radius: 4px;
      background-color: #1a1a1a;
      color: var(--sdpi-color);
      font-size: 12px;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--sdpi-highlight);
    }

    .sdpi-item-checkbox {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--sdpi-highlight);
    }

    .sdpi-heading {
      font-size: 13px;
      font-weight: 600;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--sdpi-bordercolor);
      margin-bottom: 8px;
    }

    .sdpi-info {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    button {
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      background-color: var(--sdpi-highlight);
      color: white;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3367D6;
    }

    /* Health Status Section */
    .health-status {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      padding: 6px 8px;
      background-color: #1a1a1a;
      border-radius: 4px;
    }

    .health-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .health-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #6b7280;
      transition: background-color 0.3s;
    }

    .health-indicator.online {
      background-color: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .health-indicator.offline {
      background-color: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .health-label {
      font-size: 11px;
      color: #888;
    }

    /* Instance dropdown */
    .instance-select {
      margin-top: 6px;
    }

    #instanceSelect {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--sdpi-bordercolor);
      border-radius: 4px;
      background-color: #1a1a1a;
      color: var(--sdpi-color);
      font-size: 12px;
    }

    #instanceSelect:focus {
      outline: none;
      border-color: var(--sdpi-highlight);
    }

    /* Instance list */
    #instanceList {
      margin-top: 6px;
      padding: 6px;
      background-color: #1a1a1a;
      border-radius: 4px;
      max-height: 150px;
      overflow-y: auto;
    }

    .instance-item {
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .instance-item:last-child {
      margin-bottom: 0;
    }

    .instance-item:hover {
      background-color: #333;
    }

    .instance-item.selected {
      background-color: var(--sdpi-highlight);
      color: white;
    }

    .instance-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .instance-name {
      font-weight: 500;
    }

    .instance-cwd {
      font-size: 10px;
      color: #888;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .instance-item.selected .instance-cwd {
      color: rgba(255,255,255,0.7);
    }

    .instance-state {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background-color: #444;
      text-transform: uppercase;
      font-weight: 500;
    }

    .state-idle { background-color: #4285F4; color: #fff; }
    .state-running { background-color: #3b82f6; color: #fff; }
    .state-tool_use { background-color: #4285F4; color: #fff; }
    .state-editing { background-color: #7C4DFF; color: #fff; }
    .state-question { background-color: #06b6d4; color: #000; }
    .state-permission { background-color: #ef4444; color: #fff; }
    .state-error { background-color: #dc2626; color: #fff; }
    .state-disconnected { background-color: #6b7280; color: #fff; }

    .refresh-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Folder picker */
    .folder-input-row {
      display: flex;
      gap: 6px;
    }

    .folder-input-row input[type="text"] {
      flex: 1;
    }

    .folder-input-row button {
      flex-shrink: 0;
      padding: 5px 10px;
    }

    .folder-path-display {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Gemini Instance Settings</div>

    <!-- Health Status -->
    <div class="health-status">
      <div class="health-item">
        <div class="health-indicator" id="serverStatus"></div>
        <span class="health-label">Server</span>
      </div>
      <div class="health-item">
        <div class="health-indicator" id="kittyStatus"></div>
        <span class="health-label">Kitty</span>
      </div>
    </div>

    <!-- Instance Name is hidden from UI but still used programmatically for auto-fill from folder name -->
    <input type="hidden" id="instanceName" />

    <div class="sdpi-item sdpi-item-checkbox">
      <input type="checkbox" id="autoAssign" />
      <label for="autoAssign">Auto-assign next available instance</label>
    </div>

    <input type="hidden" id="sessionId" />

    <div class="sdpi-item">
      <div class="sdpi-item-label">Display Mode</div>
      <select id="displayMode" class="sdpi-item-value">
        <option value="status">Status (Animated)</option>
        <option value="tokens">Token Counter</option>
        <option value="cost">Cost Tracker</option>
        <option value="activity">Activity Log</option>
      </select>
      <div class="sdpi-info">Choose what to display on the key</div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Project Folder</div>
      <div class="sdpi-item-value folder-input-row">
        <input type="text" id="projectFolder" placeholder="/path/to/project" />
        <button id="browseFolder">Browse</button>
      </div>
      <div class="sdpi-info">When set, pressing the button launches Gemini CLI in this folder</div>
    </div>

    <div class="sdpi-item">
      <div class="refresh-row">
        <div class="sdpi-item-label">Available Instances</div>
        <button id="refreshInstances">Refresh</button>
      </div>
      <div id="instanceList">
        <div class="sdpi-info">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    let websocket = null;
    let uuid = null;
    let actionInfo = null;
    let settings = {};
    let healthCheckInterval = null;

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inPluginUUID;
      actionInfo = JSON.parse(inActionInfo);
      settings = actionInfo.payload.settings || {};

      websocket = new WebSocket("ws://127.0.0.1:" + inPort);

      websocket.onopen = function() {
        websocket.send(JSON.stringify({
          event: inRegisterEvent,
          uuid: inPluginUUID
        }));

        loadSettings();
        checkHealth();
        refreshInstances();

        // Auto-refresh health and instances every 3 seconds
        healthCheckInterval = setInterval(() => {
          checkHealth();
          refreshInstances();
        }, 3000);
      };

      websocket.onmessage = function(evt) {
        const data = JSON.parse(evt.data);
        if (data.event === "didReceiveSettings") {
          settings = data.payload.settings || {};
          loadSettings();
        }
      };

      websocket.onclose = function() {
        if (healthCheckInterval) {
          clearInterval(healthCheckInterval);
        }
      };
    }

    function loadSettings() {
      document.getElementById("instanceName").value = settings.instanceName || "";
      document.getElementById("sessionId").value = settings.sessionId || "";
      document.getElementById("autoAssign").checked = settings.autoAssign || false;
      document.getElementById("displayMode").value = settings.displayMode || "status";
      document.getElementById("projectFolder").value = settings.projectFolder || "";
    }

    function saveSettings() {
      settings.instanceName = document.getElementById("instanceName").value;
      settings.sessionId = document.getElementById("sessionId").value;
      settings.autoAssign = document.getElementById("autoAssign").checked;
      settings.displayMode = document.getElementById("displayMode").value;
      settings.projectFolder = document.getElementById("projectFolder").value;

      if (websocket && websocket.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify({
          event: "setSettings",
          context: uuid,
          payload: settings
        }));
      }
    }

    function browseFolder() {
      const browseBtn = document.getElementById("browseFolder");
      browseBtn.disabled = true;
      browseBtn.textContent = "...";

      fetch("http://127.0.0.1:19847/pick-folder", { method: "POST" })
        .then(res => res.json())
        .then(data => {
          if (data.success && data.path) {
            document.getElementById("projectFolder").value = data.path;
            // Auto-fill instance name from folder name if empty
            if (!document.getElementById("instanceName").value) {
              const folderName = data.path.split("/").pop();
              document.getElementById("instanceName").value = folderName;
            }
            saveSettings();
          }
        })
        .catch(err => {
          console.error("Failed to open folder picker:", err);
        })
        .finally(() => {
          browseBtn.disabled = false;
          browseBtn.textContent = "Browse";
        });
    }

    function checkHealth() {
      const serverIndicator = document.getElementById("serverStatus");
      const kittyIndicator = document.getElementById("kittyStatus");

      // Check server health
      fetch("http://127.0.0.1:19847/health")
        .then(res => res.json())
        .then(data => {
          serverIndicator.className = "health-indicator online";
        })
        .catch(() => {
          serverIndicator.className = "health-indicator offline";
        });

      // Check Kitty status
      fetch("http://127.0.0.1:19847/kitty-status")
        .then(res => res.json())
        .then(data => {
          kittyIndicator.className = data.available ? "health-indicator online" : "health-indicator offline";
        })
        .catch(() => {
          kittyIndicator.className = "health-indicator offline";
        });
    }

    function refreshInstances(forceCleanup = false) {
      // Use cleanup and dedupe params when manually refreshing
      // Filter by source=gemini to only show Gemini instances
      const params = forceCleanup ? "?cleanup=true&dedupe=true&source=gemini" : "?dedupe=true&source=gemini";
      fetch("http://127.0.0.1:19847/instances" + params)
        .then(res => res.json())
        .then(instances => {
          const list = document.getElementById("instanceList");
          if (instances.length === 0) {
            list.innerHTML = '<div class="sdpi-info">No Gemini instances detected. Start a Gemini CLI session first.</div>';
            return;
          }

          list.innerHTML = instances.map(inst => {
            const selected = inst.sessionId === settings.sessionId ? "selected" : "";
            const shortId = inst.sessionId.substring(0, 8);
            const cwd = inst.metadata?.cwd || "";
            const projectName = cwd.split("/").pop() || shortId;
            return `
              <div class="instance-item ${selected}" data-session="${inst.sessionId}">
                <div class="instance-info">
                  <span class="instance-name">${projectName}</span>
                  <span class="instance-cwd" title="${cwd}">${cwd}</span>
                </div>
                <span class="instance-state state-${inst.state}">${inst.state}</span>
              </div>
            `;
          }).join("");

          list.querySelectorAll(".instance-item").forEach(item => {
            item.addEventListener("click", function() {
              document.getElementById("sessionId").value = this.dataset.session;
              // Auto-fill instance name from project folder
              const projectName = this.querySelector(".instance-name").textContent;
              if (!document.getElementById("instanceName").value) {
                document.getElementById("instanceName").value = projectName;
              }
              saveSettings();
              refreshInstances();
            });
          });
        })
        .catch(() => {
          document.getElementById("instanceList").innerHTML =
            '<div class="sdpi-info">Could not connect to AgentDeck server.</div>';
        });
    }

    document.getElementById("instanceName").addEventListener("change", saveSettings);
    document.getElementById("autoAssign").addEventListener("change", saveSettings);
    document.getElementById("displayMode").addEventListener("change", saveSettings);
    document.getElementById("projectFolder").addEventListener("change", saveSettings);
    document.getElementById("browseFolder").addEventListener("click", browseFolder);
    document.getElementById("refreshInstances").addEventListener("click", () => refreshInstances(true));
  </script>
</body>
</html>
