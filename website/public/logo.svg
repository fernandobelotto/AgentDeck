<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main button shape -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="url(#buttonGrad)"/>
  <!-- Inner glow -->
  <rect x="15" y="15" width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- AI brain/circuit icon -->
  <circle cx="50" cy="40" r="12" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="50" cy="40" r="5" fill="#fff"/>
  <!-- Connection lines -->
  <line x1="50" y1="52" x2="50" y2="65" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="40" x2="25" y2="40" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="40" x2="75" y2="40" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- Status indicator dots -->
  <circle cx="30" cy="70" r="5" fill="#22c55e"/>
  <circle cx="50" cy="70" r="5" fill="#3b82f6"/>
  <circle cx="70" cy="70" r="5" fill="#f97316"/>
</svg>
