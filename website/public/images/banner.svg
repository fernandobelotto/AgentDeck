<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.1" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Stream Deck buttons -->
  <g transform="translate(100, 120)">
    <!-- Button 1 - idle (green) -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="#1f2937" stroke="#22c55e" stroke-width="3"/>
    <path d="M30 45 L38 53 L55 32" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Button 2 - running (blue) -->
    <rect x="100" y="0" width="80" height="80" rx="12" fill="#1f2937" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="140" cy="40" r="20" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="30 70" stroke-linecap="round"/>

    <!-- Button 3 - tool_use (orange) -->
    <rect x="200" y="0" width="80" height="80" rx="12" fill="#1f2937" stroke="#f97316" stroke-width="3"/>
    <circle cx="240" cy="40" r="15" fill="none" stroke="#f97316" stroke-width="4"/>
    <circle cx="240" cy="40" r="5" fill="#f97316"/>
  </g>

  <!-- Text -->
  <text x="600" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle">AgentDeck</text>
  <text x="600" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Stream Deck Plugin for AI Coding Assistants</text>

  <!-- Status indicators legend -->
  <g transform="translate(420, 280)">
    <circle cx="0" cy="0" r="8" fill="#22c55e"/>
    <text x="15" y="5" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Idle</text>

    <circle cx="80" cy="0" r="8" fill="#3b82f6"/>
    <text x="95" y="5" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Running</text>

    <circle cx="180" cy="0" r="8" fill="#f97316"/>
    <text x="195" y="5" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Tool Use</text>

    <circle cx="290" cy="0" r="8" fill="#a855f7"/>
    <text x="305" y="5" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Editing</text>
  </g>
</svg>
